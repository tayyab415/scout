[project]
name = "scout"
version = "0.1.0"
description = "A blind humanoid body model learns to explore houses it has never seen, remember what it saw, and go back to it."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sim = ["mujoco>=3.3"]
teacher = ["boto3>=1.34", "requests>=2.31"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
